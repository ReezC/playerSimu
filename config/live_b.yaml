# 测谎在跑时，主回路（怪物识别）主动让路到多少 fps（0 = 不让路）
# ⚠ 两个模型抢同一块 GPU（用户 2026-10-17：同一窗口实例不能同时跑）⇒
#   要让路就设 8；设 0 = 现状（先全速、积压后再把测谎降到 2fps）
# 测谎触发方式：screen = 先嗅探，测谎窗口出现才跑跟踪（默认）；off = 勾上就一直喂
vt_gate: screen
# 测谎窗口消失后还保留多久算「仍在测谎」（秒，防抖；期间战斗检测继续暂停）
vt_hold_s: 1.5
# 一旦发现测谎窗口，就**保证喂帧这么多秒**（盖住整场小游戏；界面状态认不出
# 小游戏窗口时靠它兜底 ✓ 收到 SUCCESS/ENDED 会立刻清零，不会白停战斗 ✓）
