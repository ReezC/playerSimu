# ---- 链路配置 ----
# A 机（仿真机 / 推流端）
a_host: "192.168.1.9"
# B 机（工作机 / 本机的 IP），A 机 OBS 推流目标
b_host: "192.168.1.2"

# ---- A 机屏幕 / DPI（**这两行是唯一来源** ✓ A、B 共用同一份 ✓）----
#   用户 2026-10-17：「填写 A 机的分辨率、DPI 缩放比例，需要用到的地方（包括 B 机
#   如果需要这些数据的话）**一律走取这个配置的自计算**」✓
#   · 逻辑分辨率 = 物理 ÷ dpi_scale（Windows 显示缩放 150% ⇒ 1.5 ✓）
#   · 输出缩放   = 流分辨率宽 ÷ 逻辑分辨率宽（`core/screen.py` ✓ **只算这一处** ✓）
#   ⚠ 部署台最上面那张「分辨率设置」卡片改的就是这三行 ✓（改完自动写回这里 ✓）
#   ⚠ B 机要用（探针采样 / 换算）也只读这里 ✗ 别再手填 `probe.out_scale` ✓
screen:
  width: 1920.0 # A 机屏幕**物理**分辨率
  height: 1080.0
  dpi_scale: 1.0 # Windows 显示缩放：100% ⇒ 1.0 · 125% ⇒ 1.25 · 150% ⇒ 1.5

stream:
  protocol: "udp"        # udp | srt | rtsp
  port: 5000
  # B 机监听 URL（PyAV 直接用）
  url: "udp://0.0.0.0:5000"
  format: "mpegts"       # 输入容器格式。h264 推流用 mpegts 容器。
                         # mjpeg 裸流时改成 "mjpeg"（否则自动探测 InvalidDataError）。
  width: 1366
  height: 768
  fps: 60

# ---- 推流自检的握手通道（A 机 公告 → B 机 对齐 + 回执）----
#
# 两边各自绑同一个 UDP 号：A 机用它发"第几段开始"（顺带收 B 机的回执），
# B 机（tools.stream_sweep）用它听公告，按 A 机公告的那一段量 —— 所以
# **谁先跑都行**，不用再掐时间（老流程要求"A 机点开始后几秒内跑 B 机命令"，
# 晚了就整轮对不上，2026-09-25 实测踩过）。
#
# 两边不一致的现象 = B 机一直退回"按清单顺序走"（它对不上了），所以部署台的
# 环境自检会拿它和 A 机 config/deploy.json 的 sweep.port 比对。
sweep:
  port: 5002

# ---- 小地图推流（A 机 → B 机，寻路定位用）----
#
# 什么时候要：只在用「寻路定位」时才起（工作台「路线识别 → 小地图定位」）。
#   A 机：部署台里「小地图推流」卡片 → 框选 → 启动；它监听下面这个 TCP 口。
#   B 机：perception/minimap.py 连这个口（不传 --port 就读这里）。
# 两边不一致的现象 = B 机一直「没收到帧」，所以部署台的环境自检会拿它比对。
#
# **小地图区域不写在这**：它取决于 A 机的屏幕布局（窗口位置/分辨率/UI 缩放），
# 由部署台卡片里的「框选…」存进 config/deploy.json（A 机本地那份）。
minimap:
  port: 5003

# ---- 双机时钟同步 ----
clock_sync:
  server_port: 5001      # A 机上运行 tools/clock_server.py 监听此 UDP 端口
  samples: 200           # 采样次数
  interval_ms: 10        # 采样间隔

# ---- 屏幕时间码探针（用于测端到端延迟）----
#
# ⚠ 位置别再手填了：实时预览那页有「框选探针」按钮 —— 在画面上框住方块带，
#   当场解码验证（解得出才保存）。结果存在 config/probe_calib.json，存的是
#   **画面比例**（换分辨率/窗口不用重标），优先于下面的像素值。
#   下面的 x/y/cell/gap 是**没有做过人工框选时**的回退值。
probe:
  enabled: true
  # 这里的 x/y/cell/gap 是**流画面里的实测值**，由 `probe_auto --solve`
  # 在 1366x768 流上量出来的（解出「接近此刻」的时间戳即为正确）。
  #
  # A 机侧对应关系（A 机屏幕物理 2560x1440、Windows 显示缩放 150%、
  # 推流 1366x768）：
  #   A 机 probe_gen 用「逻辑像素」，链路是：
  #     逻辑值 → ×1.5(DPI) → 物理值 → ×0.5336(2560→1366) → 流值
  #     合计 ×0.8004
  #   A 机配置（整数逻辑值）： x=139 y=14 cell=23 gap=3
  #   换算到流里： 139×0.8004=111.2 / 23×0.8004=18.4 —— 与下面的实测值
  #   有零点几像素的取整偏差，所以以 `--solve` 实测为准。
  #
  # ⚠ cell 必须 ≥ 16px：方块太小（如 720p 下 12px）时，40 位时间戳的
  #   信息量被压缩磨掉，解码结果是错位凑出来的假值。
  x: 0 # 探针左上角坐标（流画面坐标，窄行窗口实测：第一个白块左缘）
  y: 0
  cell: 16.0 # 每个 bit 方块边长（px，实测白块宽 17~18）
  gap: 2.0 # 方块间距（px，实测相邻方块中心距 21 = cell+gap）
  bits: 40               # 时间戳位宽（毫秒）
  # ⚠⚠ **`out_scale` 已移除**（用户 2026-10-17 ✓「把探针输出缩放参数移除」✓）：
  #   它现在是**派生值** ⇒ 一律现算 = 流分辨率宽 ÷ A 机**逻辑**分辨率宽
  #   （`core/screen.out_scale` ✓ 读上面的 `[screen]` ✓ A、B 同一个算法 ✓）。
  #   ⛔ 别再手填 / 别再写回这儿 ✗ —— 改了分辨率就会忘（那正是老口径的病根 ✓）。
  #   以前的例子（留作核对 ✓）：2560×1440 @150% ⇒ 逻辑 1706×960，推流 1366×768
  #   ⇒ 1366 / 1706 ≈ 0.8004 ✓（现在这个数由 `[screen]` 自动算出来 ✓）。

# ---- 远程键盘（控制机 agent → 游戏机 Pro Micro 硬件键盘）----
kbd:
  enabled: true           # true 后 agent 按键走远程 Pro Micro（否则本地 SendInput）
  host: "192.168.1.9"     # 游戏机（relay 跑在这）的 IP，默认同 a_host
  port: 9000
  cert: "remote_kbd/certs/cert.pem"
  # 以下只在游戏机跑 relay 时用（agent 不用）：
  serial: "COM4"          # 游戏机上 Pro Micro 的串口号，改成实际的
  # 本地直连 Pro Micro（ProMicro(本地) 输入设备）用：
  serial_local: "COM8" # 本机 Pro Micro 的串口号，改成实际的

# ---- 路径 ----
paths:
  record_dir: "data/recordings"
  dataset_dir: "data/datasets"
